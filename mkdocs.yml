site_name: NeuroDoc
site_url: https://neurodoc.app.br/technical-docs/
docs_dir: docs
site_dir: site
use_directory_urls: true
theme:
  name: material
  language: pt-BR
markdown_extensions:
  - tables
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
