{% comment %}Saída explícita da identificação. Ver `PortalLeaveView`: quem
termina num computador que não é seu não pode depender de esperar trinta
minutos.{% endcomment %}
<form method="post" action="{% url 'portal:leave' slug %}" class="mt-3 text-center">
    {% csrf_token %}
    <button type="submit" class="btn btn-link fs-12 text-muted p-0">
        Encerrar identificação e sair
    </button>
</form>
