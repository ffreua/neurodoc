{% extends "base.html" %}
{% block title %}Confirmar código{% endblock %}
{% block content %}
<h1>Confirmar código</h1>
{% if error %}<p style="color:red">{{ error }}</p>{% endif %}
<form method="post" action="{% url 'communications:verify-otp' raw_token %}">
    {% csrf_token %}
    <input type="text" name="otp" maxlength="8" placeholder="Código de 8 dígitos">
    <button type="submit">Confirmar</button>
</form>
{% endblock %}
