{% extends "base.html" %}
{% block title %}Aceitar convite — NeuroDoc{% endblock %}
{% block content %}
<h1>Aceitar convite</h1>
<p>Você foi convidado para {{ invitation.target_tenant.legal_name }} com os
papéis: {{ invitation.role_grants|join:", " }}.</p>
<form method="post">
    {% csrf_token %}

</form>
{% endblock %}
