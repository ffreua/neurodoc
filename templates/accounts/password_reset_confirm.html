{% extends "base.html" %}
{% block title %}Nova senha — NeuroDoc{% endblock %}
{% block content %}
<h1>Definir nova senha</h1>
{% if validlink %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Salvar</button>
</form>
{% else %}
<p>O link de recuperação é inválido ou já foi usado.</p>
{% endif %}
{% endblock %}
