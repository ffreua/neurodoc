api:
  dashboard: false
log:
  level: WARN
ping:
  entryPoint: ping
entryPoints:
  web:
    address: :80
    forwardedHeaders:
      trustedIPs: &id001
      - 173.245.48.0/20
      - 103.21.244.0/22
      - 103.22.200.0/22
      - 103.31.4.0/22
      - 141.101.64.0/18
      - 108.162.192.0/18
      - 190.93.240.0/20
      - 188.114.96.0/20
      - 197.234.240.0/22
      - 198.41.128.0/17
      - 162.158.0.0/15
      - 104.16.0.0/13
      - 104.24.0.0/14
      - 172.64.0.0/13
      - 131.0.72.0/22
      - 2400:cb00::/32
      - 2606:4700::/32
      - 2803:f800::/32
      - 2405:b500::/32
      - 2405:8100::/32
      - 2a06:98c0::/29
      - 2c0f:f248::/32
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: :443
    forwardedHeaders:
      trustedIPs: *id001
    transport:
      respondingTimeouts:
        readTimeout: 60s
        writeTimeout: 0s
        idleTimeout: 180s
  ping:
    address: :8082
providers:
  swarm:
    endpoint: unix:///var/run/docker.sock
    exposedByDefault: false
    network: traefik_public
    constraints: Label(`com.neurodoc.platform`, `neurodoc_v1`)
certificatesResolvers:
  cloudflare:
    acme:
      email: CHANGE_ME
      caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      storage: /letsencrypt/acme-staging.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
        - 1.1.1.1:53
        - 8.8.8.8:53
