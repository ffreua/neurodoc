    - {code: versoes, label: Versões, input: state}
    - {code: diplopia, label: Diplopia, input: boolean}
    - {code: seguimento_horizontal, label: Seguimento horizontal, input: state}
    - {code: seguimento_vertical, label: Seguimento vertical, input: state}
    - {code: sacada_horizontal, label: Sacada horizontal, input: state}
    - {code: sacada_vertical, label: Sacada vertical, input: state}
    - {code: convergencia, label: Convergência, input: state}
    - {code: divergencia, label: Divergência, input: state}
