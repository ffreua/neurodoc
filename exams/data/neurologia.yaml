- code: nervos_cranianos
  label: Nervos cranianos
  children:

  - code: nc1
    label: I — Olfatório
    children:
    - {code: olfato, label: Avaliação do olfato, input: state, side: true,
       help: "Uma narina por vez, com substâncias não irritantes."}

  - code: nc2
    label: II — Óptico
    children:
    - {code: acuidade, label: Acuidade visual, input: text, side: true, help: "Tabela de Rosenbaum; se < 20/800, CD/MM/PL/APL."}
    - code: campo_visual
      label: Campo visual
      input: choice
      side: true
      options: [Normal, Hemianopsia, Quadrantanopsia, Escotoma, Constrição de campo, Déficit altitudinal]
    - code: cores
      label: Visão para cores
      input: choice
      side: true
      options: [Normal, Dessaturação do vermelho, Alterada nas tabelas de Ishihara]
    - {code: fundoscopia, label: Fundoscopia, input: text, side: true}
    - {code: fotomotor_direto, label: Reflexo fotomotor direto, input: state, side: true}
    - {code: fotomotor_consensual, label: Reflexo fotomotor consensual, input: state, side: true}
    - code: dpa
      label: Defeito pupilar aferente
      input: choice
      side: true
      options: [Ausente, DPA absoluto, DPAR]

  - code: nc3_4_6
